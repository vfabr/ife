name: vscode
on:
  workflow_dispatch:
    inputs:
      version:
        description: VS Code version tag
        required: true
      exclude:
        description: built-in extensions to leave out, separated by spaces
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      EXCLUDE: ${{ inputs.exclude }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: ${{ inputs.version }}
          path: vscode
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: vscode/.nvmrc
      - name: system packages
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev
      - name: dependencies
        working-directory: vscode
        run: npm ci
      - name: exclude extensions
        working-directory: vscode
        run: |
          for e in $EXCLUDE; do sed -i "s/^const excludedExtensions = \[/&\n\t'$e',/" build/lib/extensions.ts; done
          sed -n '/^const excludedExtensions/,/^];/p' build/lib/extensions.ts
      - name: build
        working-directory: vscode
        run: npm run gulp vscode-web-min
      - name: package
        run: |
          tar -czf "vscode-web-$VERSION.tar.gz" -C vscode-web .
          sha256sum "vscode-web-$VERSION.tar.gz" > "vscode-web-$VERSION.tar.gz.sha256"
          du -sh vscode-web "vscode-web-$VERSION.tar.gz"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="vscode-web-$VERSION.tar.gz vscode-web-$VERSION.tar.gz.sha256"
          notes="VS Code $VERSION for the web, built from microsoft/vscode, MIT. Left out: ${EXCLUDE:-nothing}"
          if gh release view "vscode-$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "vscode-$VERSION" $files --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "vscode-$VERSION" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "vscode-$VERSION" $files --repo "$GITHUB_REPOSITORY" --title "vscode-$VERSION" --notes "$notes" --latest=false
          fi
